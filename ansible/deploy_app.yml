- name: Deploiement de todolist
  hosts: my_infra
  become: true

  tasks:
    - name: Installer les paquets
      ansible.builtin.apt:
        name: [git, python3-venv, python3-packaging]
        update_cache: true

    - name: Creer l'utilisateur systeme todolist (non privilegie)
      ansible.builtin.user:
        name: todolist
        system: true
        shell: /usr/sbin/nologin
        home: /opt/todolist
        create_home: false

    - name: Autoriser git a operer sur /opt/todolist (appartient a todolist)
      ansible.builtin.command:
        cmd: git config --global --add safe.directory /opt/todolist
      changed_when: false

    - name: Recuperer les sources depuis GitHub
      ansible.builtin.git:
        repo: https://github.com/Sjassim09/to-do-list-unsecure.git
        dest: /opt/todolist
        version: "{{ branch }}"
        force: true

    - name: Mode production (DEBUG = False)
      ansible.builtin.lineinfile:
        path: /opt/todolist/todo/settings.py
        regexp: '^DEBUG ='
        line: 'DEBUG = False'
      when: environnement == "prod"

    - name: Installer les dependances Python
      ansible.builtin.pip:
        name: [django==6.0, pyyaml==5.3.1, requests==2.19.1, gunicorn]
        virtualenv: /opt/todolist/venv
        virtualenv_command: python3 -m venv

    - name: Preparer la base
      ansible.builtin.command:
        cmd: /opt/todolist/venv/bin/python manage.py migrate
        chdir: /opt/todolist

    - name: Donner la propriete du dossier a l'utilisateur todolist
      ansible.builtin.file:
        path: /opt/todolist
        owner: todolist
        group: todolist
        recurse: true

    - name: Generer une SECRET_KEY aleatoire (hors du code source)
      ansible.builtin.set_fact:
        django_secret: "{{ lookup('password', '/dev/null length=50 chars=ascii_letters,digits') }}"

    - name: Creer le service todolist (durci)
      ansible.builtin.copy:
        dest: /etc/systemd/system/todolist.service
        content: |
          [Unit]
          Description=todolist
          After=network.target

          [Service]
          User=todolist
          Group=todolist
          WorkingDirectory=/opt/todolist
          Environment=HOME=/opt/todolist
          Environment=DJANGO_SECRET_KEY={{ django_secret }}
          ExecStart=/opt/todolist/venv/bin/gunicorn --bind 0.0.0.0:80 todo.wsgi:application
          Restart=always

          # --- Durcissement ---
          NoNewPrivileges=true
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          ProtectSystem=strict
          ReadWritePaths=/opt/todolist
          ProtectHome=true
          PrivateTmp=true
          ProtectKernelTunables=true
          ProtectControlGroups=true
          RestrictSUIDSGID=true

          [Install]
          WantedBy=multi-user.target

    - name: Demarrer le service todolist
      ansible.builtin.systemd:
        name: todolist
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Verifier que l'appli repond
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}"
      register: resultat
      until: resultat.status == 200
      retries: 5
      delay: 2
